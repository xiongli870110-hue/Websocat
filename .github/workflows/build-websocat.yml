name: Build and Release Websocat

on:
  workflow_dispatch:

jobs:
  build-websocat:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Install dependencies
      run: |
        sudo apt update
        sudo apt install -y \
          build-essential \
          curl git pkg-config libssl-dev \
          rustc cargo

    - name: Build websocat
      run: |
        git clone https://github.com/vi/websocat.git
        cd websocat
        cargo build --release
        mkdir -p ../output
        cp target/release/websocat ../output/websocat

    - name: Package build output
      run: |
        tar -czvf websocat-build.tar.gz output

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v1
      with:
        tag_name: websocat-1.14.1
        name: "Websocat Build (Ubuntu 22.04)"
        body: |
          ✅ Built inside Ubuntu 22.04 runner  
          ✅ Includes WebSocket client/server features  
          ✅ Compatible with most modern Linux distributions
        files: websocat-build.tar.gz
      env:
        GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
